name: Terraform Plan

# Запускається на PR з змінами в terraform/ директорії
on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
    # Крок 1: Завантажити код з Git
    - name: Checkout code
      uses: actions/checkout@v4

    # Крок 2: Встановити Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.0

    # Крок 3: Ініціалізувати Terraform
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # Крок 4: Перевірити синтаксис
    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    # Крок 5: Форматування (перевірка)
    - name: Terraform Format Check
      working-directory: terraform
      run: terraform fmt -check -recursive

    # Крок 6: Terraform Plan
    - name: Terraform Plan
      working-directory: terraform
      run: |
        terraform plan -no-color -out=tfplan > plan_output.txt 2>&1
        cat plan_output.txt
      continue-on-error: true

    # Крок 7: Загрузити plan як artifact
    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan
        path: terraform/tfplan
        retention-days: 1

    # Крок 8: Показати результат в PR comment
    - name: Comment PR with Plan
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const planOutput = fs.readFileSync('terraform/plan_output.txt', 'utf8');

          const comment = `## 🔧 Terraform Plan

          \`\`\`
          ${planOutput}
          \`\`\`

          ### Next Steps:
          1. Reviewer: Check the plan above
          2. If OK: Merge this PR
          3. Developer: \`cd terraform && terraform apply\`
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
      continue-on-error: true

    # Крок 9: Показати результат як summary
    - name: Terraform Plan Summary
      working-directory: terraform
      run: |
        echo "## Terraform Plan Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Review the plan above in PR comments" >> $GITHUB_STEP_SUMMARY
        echo "2. Approve the PR if changes look good" >> $GITHUB_STEP_SUMMARY
        echo "3. Developer runs locally: \`cd terraform && terraform apply\`" >> $GITHUB_STEP_SUMMARY
